:root {
  --graphite: #050505;
  --night: #050505;
  --burgundy: #FFFFFF;
  --brown: #111111;
  --navy: #000000;
  --green: #2A2A2A;
  --gold: #FFFFFF;
  --copper: #FFFFFF;
  --gray: #ADADAC;
  --ivory: #F7F4EF;
  --ink: #000000;
  --text: #F7F4EF;
  --text-2: #ADADAC;
  --text-3: rgba(173,173,172,.8);
  --danger: #ADADAC;
  --safe-top: env(safe-area-inset-top);
  --safe-bottom: env(safe-area-inset-bottom);
  --serif: "Forum", "Iowan Old Style", Palatino, Georgia, serif;
  --sans: "Montserrat", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--graphite); color: var(--text); font-family: var(--sans); font-size: 17px; line-height: 1.35; }
body { min-height: 100dvh; -webkit-font-smoothing: antialiased; font-weight: 300; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
img, svg { display: block; width: 22px; height: 22px; flex: none; }

.blob { position: absolute; border-radius: 50%; filter: blur(40px); opacity: .9; }
.blob.a { width: 78vw; height: 78vw; background: rgba(255,255,255,.14); top: -18vw; left: -20vw; animation: drift 22s ease-in-out infinite alternate; }
.blob.b { width: 56vw; height: 56vw; background: #2A2A2A; right: -18vw; bottom: 8vw; animation: drift 26s ease-in-out infinite alternate-reverse; }
.blob.c { width: 64vw; height: 64vw; background: rgba(255,255,255,.08); left: -10vw; bottom: -20vw; animation: drift 24s ease-in-out infinite alternate; }
@keyframes drift { from { transform: translate3d(0,0,0) scale(1); } to { transform: translate3d(8%, -6%, 0) scale(1.08); } }
.auth, .main { min-height: 100dvh; }
.auth { padding: calc(32px + var(--safe-top)) 24px calc(28px + var(--safe-bottom)); display: flex; flex-direction: column; gap: 22px; }
.main { padding: calc(12px + var(--safe-top)) 0 calc(108px + var(--safe-bottom)); display: flex; flex-direction: column; gap: 18px; }
.pad { padding-left: 20px; padding-right: 20px; }
.center { text-align: center; }
.logo { margin: 4px auto 8px; }
.logo svg { width: 100%; height: auto; }
.logo-full { width: min(280px, 78vw); }
.logo-mark { width: min(210px, 64vw); margin-left: 0; }
.logo-emblem { width: 120px; }
.eyebrow { margin: 0; color: var(--gold); font-size: 12px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; }
h1, h2, .serif { font-family: var(--serif); font-weight: 400; letter-spacing: 0.01em; }
h1 { font-size: 44px; line-height: 1.02; margin: 0; }
h2 { font-size: 34px; line-height: 1.05; margin: 0; }
.lede { margin: 0; color: var(--text-2); }
.stack { display: flex; flex-direction: column; gap: 8px; }
label.field, .field-label { font-size: 13px; font-weight: 600; color: var(--text-2); }
input[type="text"], input[type="tel"], input[type="date"], input[type="search"] {
  width: 100%; border: 0; outline: none; background: transparent; font-size: 17px; padding: 0;
}
.glass {
  position: relative;
  background: linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.045));
  border: 1px solid rgba(255,255,255,.18);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.34), 0 16px 36px rgba(0,0,0,.28);
  backdrop-filter: blur(26px) saturate(1.5);
  -webkit-backdrop-filter: blur(26px) saturate(1.5);
}
.glass.r28 { border-radius: 28px; }
.glass.r24 { border-radius: 24px; }
.glass.r22 { border-radius: 22px; }
.field {
  padding: 16px 16px;
}
.field.big { font-variant-numeric: tabular-nums; font-size: 22px; }
.btn, .btn-ghost, .link {
  border: 0; border-radius: 26px; width: 100%; padding: 16px 18px; font-size: 17px; font-weight: 500;
}
.btn {
  color: #000;
  background: #fff;
  border-radius: 999px;
  letter-spacing: .04em;
  font-weight: 500;
  min-height: 52px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.28);
}
.btn-ghost {
  border-radius: 999px;
  font-weight: 500;
  letter-spacing: .03em;
  color: var(--ivory);
  background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.04));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.28);
  backdrop-filter: blur(18px);
}
.btn:disabled { opacity: .42; }
.btn, .btn-ghost, .chip, .tabbar button, .qr-fab { transition: transform 140ms cubic-bezier(0.23, 1, 0.32, 1); }
.btn:active, .btn-ghost:active, .chip:active, .tabbar button:active, .qr-fab:active { transform: scale(0.97); }
.link { background: none; color: var(--gold); padding: 8px; }
.link.quiet { color: var(--gray); font-weight: 400; font-size: 14px; }
.danger { color: var(--danger); background: none; border: 0; width: 100%; padding: 8px; font-size: 15px; }
.note { margin: 0; color: var(--text-3); font-size: 13px; }
.err { margin: 0; color: var(--danger); font-size: 14px; }
.card { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.gold { color: var(--gold); }
.muted { color: var(--text-2); }
.faint { color: var(--text-3); }
.balance { font-family: var(--serif); font-size: 56px; line-height: .95; letter-spacing: -0.03em; }
.kicker { font-size: 12px; letter-spacing: .12em; font-weight: 700; color: var(--gold); }
.track { height: 8px; border-radius: 99px; background: rgba(255,255,255,.12); overflow: hidden; }
.fill { height: 100%; width: 100%; border-radius: inherit; background: #fff; transform: scaleX(0); transform-origin: left center; transition: transform 280ms cubic-bezier(0.23, 1, 0.32, 1); }
.chips, .hscroll { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar, .hscroll::-webkit-scrollbar { display: none; }
.chip {
  border: 0; color: var(--ivory); border-radius: 999px; padding: 10px 14px; white-space: nowrap;
  background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.05));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.28);
  backdrop-filter: blur(16px);
}
.chip.on { color: #000; background: #fff; font-weight: 500; }
.promo { scroll-snap-align: start; min-width: 78%; padding: 18px; min-height: 168px; display: flex; flex-direction: column; gap: 8px; text-align: left; }
.promo h3 { margin: 0; font-family: var(--serif); font-size: 24px; font-weight: 500; }
.dish-card { scroll-snap-align: start; width: 180px; padding: 12px; text-align: left; display: flex; flex-direction: column; gap: 8px; }
.dish-row { width: 100%; text-align: left; padding: 12px; display: flex; gap: 12px; align-items: flex-start; }
.art {
  border-radius: 18px; display: grid; place-items: center; color: var(--gold); position: relative; overflow: hidden;
  background:
    radial-gradient(circle at 18% 18%, rgba(255,255,255,.22), transparent 42%),
    linear-gradient(160deg, #3a3a3a, #141414 72%);
}
.art svg { width: 28px; height: 28px; }
.art.lg { height: 220px; border-radius: 28px; }
.art.lg svg { width: 48px; height: 48px; }
.art.sm { width: 76px; height: 76px; flex: none; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-size: 12px; font-weight: 700; color: #fff; background: rgba(255,255,255,.14); border-radius: 99px; padding: 4px 8px; }
.tabbar {
  position: fixed; z-index: 20; left: 12px; right: 12px; bottom: calc(8px + var(--safe-bottom));
  height: 64px; display: grid; grid-template-columns: repeat(5, 1fr); padding: 4px;
  border-radius: 26px;
}
.tabbar button {
  position: relative; border: 0; background: transparent; color: var(--text-3);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: 9px; letter-spacing: -0.03em; padding: 4px 0; border-radius: 18px;
}
.tabbar button.on { color: var(--gold); }
.tabbar button.on::before {
  content: ""; position: absolute; inset: 3px 4px; border-radius: 16px; background: rgba(184,115,51,.18); z-index: -1;
}
.tabbar svg { width: 22px; height: 22px; }
.badge {
  position: absolute; top: 2px; right: 10px; min-width: 16px; height: 16px; padding: 0 4px;
  border-radius: 99px; background: #fff; color: #000; font-size: 10px; font-weight: 800;
  display: grid; place-items: center;
}

function settleSheet() {
  const price = quote();
  const result = state.receipt ? '<div class="glass card r24"><h3 class="serif" style="margin:0">Счёт проведён</h3><div>Списано ' + esc(bonusCount(state.receipt.redeemed)) + "</div><div>Начислено " + esc(bonusCount(state.receipt.accrued)) + " · кэшбэк " + state.receipt.percent + "%</div><div>К оплате " + esc(rubles(state.receipt.paid)) + ". На карте " + esc(bonusCount(state.receipt.balance)) + ".</div>" + (state.receipt.levelChanged ? '<div class="gold">Новый уровень — ' + esc(state.receipt.levelName) + "</div>" : "") + "</div>" : "";
  return '<button class="link" data-action="close-settle">Закрыть</button><h2>Визит</h2><span class="field-label">Сумма счёта</span><div class="glass field r22 big"><input data-field="bill" inputmode="numeric" aria-label="Сумма счёта в рублях" value="' + esc(state.bill) + '"></div>' +
    (price ? '<p class="note">' + esc(price.explanation) + "</p><strong>Можно списать до " + esc(bonusCount(price.maxRedeem)) + "</strong>" + (price.maxRedeem ? '<input data-field="redeem" type="range" min="0" max="' + price.maxRedeem + '" value="' + state.redeem + '" aria-label="Сколько бонусов списать"><div class="gold">Списать ' + esc(bonusCount(state.redeem)) + "</div>" : "") : "") +
    result + (state.error ? '<p class="err">' + esc(state.error) + "</p>" : "") +
    '<button class="btn" data-action="' + (state.receipt ? "close-settle" : "pay") + '">' + (state.receipt ? "Готово" : "Провести счёт") + "</button>";
}
function banner() {
  if (!state.banner) return "";
  const note = state.banner;
  return '<button class="glass banner" data-action="banner" data-link="' + esc(typeof note.link === "string" ? note.link : "home") + '"><span class="gold">' + icon(kindIcon(note.kind)) + '</span><span><span class="kicker">Дубровский</span><strong>' + esc(note.title) + "</strong><p>" + esc(note.body) + '</p></span><span class="x" data-action="close-banner" aria-label="Закрыть уведомление">×</span></button>';
}

function sendCode() {
  const phone = normalizePhone("+7" + state.phone);
  if (!phone) { state.error = "Нужен мобильный номер, он начинается с 9."; render(); return; }
  state.db.codes[phone] = Date.now();
  state.code = "";
  state.error = "";
  state.phase = "code";
  save();
  render();
}
function verify() {
  const phone = normalizePhone("+7" + state.phone);
  if (!/^\d{6}$/.test(state.code)) { state.error = "Нужен код из 6 цифр."; render(); return; }
  if (!phone || !state.db.codes[phone] || Date.now() - state.db.codes[phone] > 300000) {
    state.error = "Сначала запросите код из СМС."; render(); return;
  }
  delete state.db.codes[phone];
  const existing = state.db.users.find((item) => item.phone === phone);
  state.token = uid();
  state.error = "";
  if (existing) {
    state.db.sessions[state.token] = existing.id;
    prepare(existing);
    state.phase = "app";
    state.tab = "home";
    ensureQR();
    save();
    maybeAskPush();
  } else {
    state.db.pending[state.token] = { phone };
    state.phase = "setup";
    save();
    render();
  }
}
function finish() {
  const pending = state.db.pending[state.token];
  if (!pending) { state.phase = "phone"; state.error = "Сессия истекла. Войдите снова."; render(); return; }
  if (!validName(state.last) || !validName(state.first)) { state.error = "Укажите имя и фамилию."; render(); return; }
  if (state.middle.trim() && !validName(state.middle)) { state.error = "Проверьте отчество."; render(); return; }
  if (!isAdult(state.birth)) { state.error = "Карта доступна гостям от 18 лет."; render(); return; }
  const person = makeNewUser(pending.phone, state);
  state.db.users.push(person);
  delete state.db.pending[state.token];
  state.db.sessions[state.token] = person.id;
  prepare(person);
  state.phase = "app";
  state.tab = "home";
  state.error = "";
  state.pendingBanner = person.notifications.find((note) => note.kind === "accrual") || null;
  ensureQR();
  save();
  maybeAskPush();
}
function enterDemo() {
  if (!state.db.users.some((item) => item.id === "user-demo")) state.db.users.push(demoUser());
  state.token = uid();
  state.db.sessions[state.token] = "user-demo";
  state.phase = "app";
  state.tab = "home";
  state.error = "";
  prepare(user());
  ensureQR();
  save();
  maybeAskPush();
}
function maybeAskPush() {
  if (!state.pushAsked) { state.sheet = "push"; render(); return; }
  render();
  if (state.pendingBanner && state.pushGranted) {
    const note = state.pendingBanner;
    state.pendingBanner = null;
    showBanner(note);
  }
}
function logout() {
  if (state.token) { delete state.db.sessions[state.token]; delete state.db.pending[state.token]; }
  state.token = null; state.phase = "phone"; state.sheet = null; state.qr = null; state.banner = null;
  save(); render();
}
function deleteAccount() {
  const person = user();
  if (person) {
    state.db.users = state.db.users.filter((item) => item.id !== person.id);
    Object.keys(state.db.sessions).forEach((token) => { if (state.db.sessions[token] === person.id) delete state.db.sessions[token]; });
  }
  state.token = null; state.phase = "phone"; state.sheet = null; state.qr = null;
  save(); render();
}
function saveProfile() {
  const person = user();
  if (!validName(state.editLast) || !validName(state.editFirst)) { state.error = "Укажите имя и фамилию."; render(); return; }
  if (state.editMiddle.trim() && !validName(state.editMiddle)) { state.error = "Проверьте отчество."; render(); return; }
  if (!isAdult(state.editBirth)) { state.error = "Карта доступна гостям от 18 лет."; render(); return; }
  person.lastName = state.editLast.trim();
  person.firstName = state.editFirst.trim();
  person.middleName = state.editMiddle.trim();
  person.birth = state.editBirth;
  state.error = "";
  state.sheet = null;
  prepare(person);
  save();
  render();
}

const app = document.getElementById("app");
app.addEventListener("click", (event) => {
  if (event.target.closest("[data-pref]")) return;
  const el = event.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;
  if (action === "dismiss" && event.target.closest(".sheet-card")) return;
  if (action === "close-banner") { event.stopPropagation(); state.banner = null; render(); return; }
  if (action === "send-code") sendCode();
  else if (action === "verify") verify();
  else if (action === "back-phone") { state.phase = "phone"; state.code = ""; state.error = ""; render(); }
  else if (action === "finish") finish();
  else if (action === "demo") enterDemo();
  else if (action === "tab") { state.tab = el.dataset.tab; state.sheet = null; render(); }
  else if (action === "levels") { state.sheet = "levels"; render(); }
  else if (action === "qr") { ensureQR(); state.sheet = "qr"; render(); }
  else if (action === "promo") openLink(el.dataset.link);
  else if (action === "dish") { state.dishId = el.dataset.id; state.sheet = "dish"; render(); }
  else if (action === "category") { state.category = el.dataset.id; render(); }
  else if (action === "filter") { state.bonusFilter = el.dataset.id; render(); }
  else if (action === "settle") { state.receipt = null; state.redeem = 0; state.sheet = "settle"; state.error = ""; render(); }
  else if (action === "pay") settle();
  else if (action === "close-settle") { state.sheet = null; state.receipt = null; render(); }
  else if (action === "note") {
    const person = user();
    const note = person.notifications.find((item) => item.id === el.dataset.id);
    if (note) { note.isRead = true; save(); openLink(note.link); }
  } else if (action === "read-all") {
    user().notifications.forEach((note) => { note.isRead = true; }); save(); render();
  } else if (action === "settings") { state.sheet = "settings"; render(); }
  else if (action === "edit") {
    const person = user();
    state.editLast = person.lastName; state.editFirst = person.firstName; state.editMiddle = person.middleName; state.editBirth = person.birth;
    state.error = ""; state.sheet = "edit"; render();
  } else if (action === "save-profile") saveProfile();
  else if (action === "logout-ask") { state.sheet = "logout"; render(); }
  else if (action === "delete-ask") { state.sheet = "delete"; render(); }
  else if (action === "logout") logout();
  else if (action === "delete") deleteAccount();
  else if (action === "allow-push") { state.pushGranted = true; state.pushAsked = true; state.sheet = null; save(); maybeAskPush(); }
  else if (action === "deny-push") { state.pushGranted = false; state.pushAsked = true; state.sheet = null; state.pendingBanner = null; save(); render(); }
  else if (action === "banner") openLink(el.dataset.link);
  else if (action === "tips-done") { try { localStorage.setItem("dubrovsky.tips", "1"); } catch (e) {} state.sheet = null; render(); }
  else if (action === "close" || action === "dismiss") { state.sheet = null; state.error = ""; render(); }
});
app.addEventListener("input", (event) => {
  const field = event.target.dataset.field;
  if (event.target.dataset.pref) {
    user().preferences[event.target.dataset.pref] = event.target.checked;
    save();
    return;
  }
  if (!field) return;
  focusField = field;
  caret = event.target.selectionStart;
  if (field === "phone") state.phone = nationalFrom(event.target.value);
  else if (field === "code") {
    state.code = event.target.value.replace(/\D/g, "").slice(0, 6);
    state.error = "";
    render();
    if (state.code.length === 6) verify();
    return;
  } else if (field === "query") state.query = event.target.value;
  else if (field === "bill") { state.bill = event.target.value.replace(/\D/g, "").slice(0, 7); state.receipt = null; }
  else if (field === "redeem") state.redeem = Number(event.target.value);
  else if (field === "birth") state.birth = event.target.value;
  else if (field === "editBirth") state.editBirth = event.target.value;
  else state[field] = event.target.value;
  state.error = "";
  render();
});
app.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && state.phase === "phone") { event.preventDefault(); sendCode(); }
});
let pullStart = 0;
app.addEventListener("pointerdown", (event) => {
  const main = document.querySelector(".main");
  if (!main || main.scrollTop > 4) { pullStart = 0; return; }
  pullStart = event.clientY;
});
app.addEventListener("pointerup", (event) => {
  if (!pullStart) return;
  const distance = event.clientY - pullStart;
  pullStart = 0;
  if (distance > 72 && state.phase === "app" && user()) {
    prepare(user());
    render();
  }
});
setInterval(() => {
  const nodes = document.querySelectorAll("[data-countdown]");
  if (!state.qr || !nodes.length) return;
  const remain = state.qr.expiresAt - Date.now();
  if (remain <= 0) { state.qr = null; ensureQR(); render(); return; }
  nodes.forEach((node) => { node.textContent = "Обновится через " + countdown(remain); });
}, 1000);

load();
const params = new URLSearchParams(location.search);
const preview = params.get("preview");
if (preview) {
  if (!state.db.users.some((item) => item.id === "user-demo")) state.db.users.push(demoUser());
  state.token = "preview-token";
  state.db.sessions["preview-token"] = "user-demo";
  state.pushGranted = true;
  state.pushAsked = true;
  state.phase = preview === "phone" ? "phone" : "app";
  state.tab = ["menu", "bonuses", "inbox", "profile"].includes(preview) ? preview : "home";
  if (preview === "notifications") state.tab = "inbox";
  if (preview === "dish") { state.tab = "menu"; state.sheet = "dish"; state.dishId = params.get("id") || "duck"; }
  if (preview === "levels") { state.tab = "home"; state.sheet = "levels"; }
  if (preview === "qr") { state.tab = "profile"; state.sheet = "qr"; }
  if (preview === "phone") state.token = null;
  prepare(user() || demoUser());
  ensureQR();
} else if (state.token && user()) {
  state.phase = "app";
  prepare(user());
  ensureQR();
  try { if (!localStorage.getItem("dubrovsky.tips")) state.sheet = "tips"; } catch (e) {}
} else if (state.token && state.db.pending[state.token]) {
  state.phase = "setup";
} else {
  state.phase = "phone";
  state.token = null;
}
render();
</script>
</body>
</html>
